name: Android F-Droid Release Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure fallback local.properties
        run: |
          if [ ! -f local.properties ]; then
            cat <<EOF > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY || 'placeholder-key' }}
          API_URL=${{ secrets.API_URL || 'https://placeholder.api.com' }}
          EOF
          fi

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew
          chmod +x ./ai/src/main/sentencepiece/build.sh

      - name: Run unit tests
        run: |
          ./gradlew \
            :ai:testDebugUnitTest \
            :app:testFdroidDebugUnitTest \
            :app:testPlayDebugUnitTest \
            --stacktrace

      - name: Build F-Droid Release
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        run: |
          APK_DIR=app/build/outputs/apk/fdroid/release
          for apk in $APK_DIR/*.apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"universal"* ]]; then
              ABI="universal"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              ABI="arm64-v8a"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              ABI="armeabi-v7a"
            elif [[ "$filename" == *"x86_64"* ]]; then
              ABI="x86_64"
            elif [[ "$filename" == *"x86"* ]]; then
              ABI="x86"
            else
              ABI=$(echo "$filename" | sed -E 's/.*-([a-z0-9_]+)\.apk/\1/')
            fi
            echo "Found APK: $apk with ABI: $ABI"
            # Copy to a standardized name for upload
            cp "$apk" "QuestPhone-${{ steps.version.outputs.version }}-$ABI.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhone-APKs-${{ steps.version.outputs.version }}
          path: QuestPhone-*.apk
